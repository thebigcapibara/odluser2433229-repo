<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prime Motors | Order Received</title>
  <!-- build:css -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/main.css">
  <!-- endbuild -->
</head>
<body>
  <main class="order">
    <a class="logo" href="/">
      <span class="logo__prime">PRIME</span>
      <span class="logo__motors">MOTORS</span>
    </a>
    <h1>Thanks, {{name}}!</h1>
    <p>We received your order for VIN <strong>{{vin}}</strong>. A representative will be in touch.</p>
    <a class="btn btn--dark" href="/">Back to inventory</a>
  </main>
  <!-- build:js -->
  <script src="js/main.js"></script>
  <!-- endbuild -->
</body>
</html>
